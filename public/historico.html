<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Histórico - HAG</title>


  <!-- =====================================================
       CHART.JS
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>


  <!-- =====================================================
       LUXON
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>


  <!-- =====================================================
       ADAPTADOR CHART.JS
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>


  <!-- =====================================================
       ESTILO
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }


    body {

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #021e1a,
          #03352c
        );

      color: #e6f1ee;

      min-height: 100vh;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {

      background:
        linear-gradient(
          90deg,
          #065f50,
          #087c67
        );

      padding: 20px 30px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,.25);

    }


    header h1 {

      margin: 0;

      font-size: 24px;

    }


    header span {

      font-size: 14px;

      color: #b9ccc7;

    }


    /* =====================================================
       MAIN
       ===================================================== */

    main {

      width: 100%;

      max-width: 1600px;

      margin: 0 auto;

      padding: 25px;

    }


    /* =====================================================
       AÇÕES
       ===================================================== */

    .acoes {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;

    }


    button {

      border: 0;

      border-radius: 8px;

      padding: 11px 18px;

      background: #087c67;

      color: white;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

    }


    button:hover {

      background: #099579;

    }


    button:disabled {

      opacity: .65;

      cursor: wait;

    }


    #horaHistorico {

      color: #b9ccc7;

      font-size: 14px;

      white-space: nowrap;

    }


    /* =====================================================
       CARDS DE CONSUMO
       ===================================================== */

    .cards-consumo {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap: 15px;

      margin-bottom: 20px;

      align-items: stretch;

    }


    .cards-consumo .card {

      min-width: 0;

      min-height: 105px;

      height: 100%;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: flex-start;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 12px;

      padding: 18px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.18);

    }


    .card-titulo {

      width: 100%;

      color: #b9ccc7;

      font-size: 13px;

      line-height: 1.3;

      margin-bottom: 8px;

    }


    .card-valor {

      width: 100%;

      font-size: 25px;

      line-height: 1.2;

      font-weight: 700;

      white-space: nowrap;

    }


    /* =====================================================
       CORES DOS CARDS
       ===================================================== */

    .cards-consumo .card:nth-child(1) {

      border-top:
        3px solid #60a5fa;

    }


    .cards-consumo .card:nth-child(2) {

      border-top:
        3px solid #22c55e;

    }


    .cards-consumo .card:nth-child(3) {

      border-top:
        3px solid #facc15;

    }


    .cards-consumo .card:nth-child(4) {

      border-top:
        3px solid #a855f7;

    }


    /* =====================================================
       PAINÉIS
       ===================================================== */

    .painel {

      background:
        rgba(0,0,0,.18);

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 12px;

      padding: 20px;

      margin-bottom: 20px;

    }


    .painel h2 {

      margin-top: 0;

      margin-bottom: 20px;

      font-size: 18px;

    }


    /* =====================================================
       GRÁFICO
       ===================================================== */

    .grafico-wrapper {

      position: relative;

      width: 100%;

      height: 420px;

    }


    #graficoHistorico {

      display: block;

      width: 100% !important;

      height: 100% !important;

    }


    /* =====================================================
       TABELA
       ===================================================== */

    .tabela-wrapper {

      width: 100%;

      overflow-x: auto;

    }


    .tabela-historico {

      width: 100%;

      border-collapse: collapse;

      min-width: 800px;

    }


    .tabela-historico th {

      background: #065f50;

      padding: 13px;

      text-align: left;

      font-size: 13px;

      position: sticky;

      top: 0;

      z-index: 2;

    }


    .tabela-historico td {

      padding: 11px 13px;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);

      font-size: 13px;

    }


    .tabela-historico tbody tr:hover {

      background:
        rgba(255,255,255,.04);

    }


    /* =====================================================
       NÍVEIS
       ===================================================== */

    .nivel-badge,
    .estado-badge {

      display: inline-block;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 700;

    }


    .normal {

      background:
        rgba(0,255,136,.14);

      color: #00ff88;

    }


    .atencao {

      background:
        rgba(255,214,0,.14);

      color: #ffd600;

    }


    .alerta {

      background:
        rgba(255,152,0,.14);

      color: #ff9800;

    }


    .critico {

      background:
        rgba(255,60,60,.16);

      color: #ff6666;

    }


    .nivel-critico {

      color: #ff6666;

      font-weight: 700;

    }


    /* =====================================================
       ESTADOS
       ===================================================== */

    .carregando,
    .sem-dados,
    .erro-historico {

      padding: 30px;

      text-align: center;

      border-radius: 10px;

      background:
        rgba(255,255,255,.04);

    }


    .erro-historico {

      color: #ff8a8a;

    }


    .erro-btn {

      margin-top: 10px;

    }


    /* =====================================================
       RESPONSIVO
       ===================================================== */

    @media (
      max-width: 1100px
    ) {

      .cards-consumo {

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

      }

    }


    @media (
      max-width: 900px
    ) {

      header {

        flex-direction: column;

        align-items: flex-start;

      }

    }


    @media (
      max-width: 600px
    ) {

      main {

        padding: 12px;

      }


      .cards-consumo {

        grid-template-columns:
          1fr;

      }


      .acoes {

        flex-direction: column;

        align-items: stretch;

      }


      #btnAtualizar {

        width: 100%;

      }


      #horaHistorico {

        align-self: flex-start;

      }


      .grafico-wrapper {

        height: 350px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->

  <header>

    <div>

      <h1>
        📊 Histórico Profissional HAG
      </h1>

      <span>
        Sistema de Monitoramento
        Hospital Arnaldo Gavazza
      </span>

    </div>


    <div id="horaHistorico">
      --
    </div>

  </header>


  <!-- =====================================================
       CONTEÚDO
       ===================================================== -->

  <main>


    <!-- ===================================================
         AÇÕES
         =================================================== -->

    <div class="acoes">

      <div>
        Histórico dos reservatórios
      </div>


      <button
        type="button"
        id="btnAtualizar"
        onclick="carregarHistorico()"
      >
        🔄 Atualizar
      </button>

    </div>


    <!-- ===================================================
         CONSUMO
         =================================================== -->

    <div class="cards-consumo">


      <div class="card">

        <div class="card-titulo">
          Consumo Elevador Hoje
        </div>

        <div
          class="card-valor"
          id="consumoElevador"
        >
          0 L
        </div>

      </div>


      <div class="card">

        <div class="card-titulo">
          Consumo Lavanderia Hoje
        </div>

        <div
          class="card-valor"
          id="consumoLavanderia"
        >
          0 L
        </div>

      </div>


      <div class="card">

        <div class="card-titulo">
          Consumo Osmose Hoje
        </div>

        <div
          class="card-valor"
          id="consumoOsmose"
        >
          0 L
        </div>

      </div>


      <div class="card">

        <div class="card-titulo">
          Consumo Total Hoje
        </div>

        <div
          class="card-valor"
          id="consumoTotal"
        >
          0 L
        </div>

      </div>


    </div>


    <!-- ===================================================
         GRÁFICO
         =================================================== -->

    <section class="painel">

      <h2>
        📈 Nível dos Reservatórios
      </h2>


      <div class="grafico-wrapper">

        <canvas
          id="graficoHistorico"
        ></canvas>

      </div>

    </section>


    <!-- ===================================================
         TABELA
         =================================================== -->

    <section class="painel">

      <h2>
        📋 Registros Históricos
      </h2>


      <div id="historico">

        <div class="carregando">
          ⏳ Carregando histórico...
        </div>

      </div>

    </section>


  </main>


  <!-- =====================================================
       JAVASCRIPT DO HISTÓRICO
       ===================================================== -->

  <script src="/historico.js"></script>


</body>

</html>
